<div class="card">
  <h2>Torch-pulse depth</h2>
  <div class="kv">
    <span>albedo</span>
    <span>
      <select id="flashAlbedo" style="background:#0b1220;color:var(--ink);border:1px solid #24344f;border-radius:4px;padding:3px 6px;font-size:12px;font-family:inherit">
        <option value="uniform" selected>uniform</option>
        <option value="mixed">mixed (stress)</option>
      </select>
    </span>
  </div>
  <button class="btn" id="btnFlash">Flash depth</button>
  <div class="kv"><span>depth MAPE</span><span id="flashMape">—</span></div>
  <div class="kv"><span>valid cells</span><span id="flashValid">—</span></div>
  <div class="kv"><span>planes</span><span id="flashPlanes">—</span></div>
  <pre id="flashAscii" style="margin-top:8px;padding:6px;background:#060a12;border:1px solid var(--line);border-radius:6px;font-size:6px;line-height:1.05;letter-spacing:0;color:var(--acc);overflow-x:auto"></pre>
  <div class="muted" id="flashDetail">
    Pulse the torch, subtract the ambient frame, invert the square law. Ranges
    are relative to the calibration patch — mixed albedo is reported separately.
  </div>
</div>
