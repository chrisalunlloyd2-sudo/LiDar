    <span>budget</span>
    <span>
      <select id="planBudget" style="background:#0b1220;color:var(--ink);border:1px solid #24344f;border-radius:4px;padding:3px 6px;font-size:12px;font-family:inherit">
        <option>2</option><option>3</option><option selected>6</option><option>8</option><option>10</option>
