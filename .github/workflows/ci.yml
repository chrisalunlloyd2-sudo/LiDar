name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: stdlib tests + secret scrub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the scrub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Test suite
        run: python -m pytest tests -q

      - name: Secret scrub (tree, published history, metadata)
        run: |
          python scripts/scrub_secrets.py \
            --tree --metadata --history \
            --rev origin/main --rev HEAD \
            --fail-on high
