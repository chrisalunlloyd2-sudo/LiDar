name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: stdlib tests + secret scrub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the scrub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Test suite
        run: python -m pytest tests -q

      - name: Build and verify the Termux package
        run: |
          bash scripts/build_termux_package.sh
          dpkg-deb -f dist/lidar_*_all.deb Package Version Architecture Depends
          dpkg-deb -f dist/lidar_*_all.deb Architecture | grep -qx all
          dpkg-deb -f dist/lidar_*_all.deb Depends | grep -q python
          R="$(mktemp -d)"
          dpkg-deb -x dist/lidar_*_all.deb "$R"
          LIDAR_HOME="$R/data/data/com.termux/files/usr/share/lidar" \
            bash "$R/data/data/com.termux/files/usr/bin/lidar" --version
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: Secret scrub (tree, published history, metadata)
        run: |
          python scripts/scrub_secrets.py \
            --tree --metadata --history \
            --rev origin/main --rev HEAD \
            --fail-on high
